<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Vis&atilde;o geral da comunidade The National em Dota 2." />
  <title>The National | Dota 2</title>
  <link rel="icon" href="assets/icone-dota-2.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="The National - in&iacute;cio">
      <img class="brand-icon" src="assets/icone-dota-2.png" alt="" />
      <span>The <b>National</b></span>
    </a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Abrir menu">
      <span></span><span></span>
    </button>
    <nav id="main-nav" aria-label="Navega&ccedil;&atilde;o principal">
      <a class="active" href="./">Vis&atilde;o Geral</a>
      <a href="membros/">Membros</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="hero-content reveal">
        <h1>THE <em>NATIONAL</em></h1>
        <div class="hero-actions">
          <a class="btn-primary" href="membros/">Ver membros <span>&rarr;</span></a>
        </div>
      </div>
    </section>

    <section class="countdown-section" id="countdown" aria-labelledby="countdown-title">
      <div class="countdown-heading reveal">
        <p>27 DE MAIO DE 2027</p>
        <h2 id="countdown-title">Contagem regressiva</h2>
      </div>
      <div class="countdown reveal" role="timer" aria-label="Tempo restante para 27 de maio de 2027">
        <div class="countdown-unit">
          <strong data-countdown="months">00</strong>
          <span>Meses</span>
        </div>
        <div class="countdown-unit">
          <strong data-countdown="days">00</strong>
          <span>Dias</span>
        </div>
        <div class="countdown-unit">
          <strong data-countdown="hours">00</strong>
          <span>Horas</span>
        </div>
        <div class="countdown-unit">
          <strong data-countdown="minutes">00</strong>
          <span>Minutos</span>
        </div>
        <div class="countdown-unit">
          <strong data-countdown="seconds">00</strong>
          <span>Segundos</span>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <a class="brand" href="./">
      <img class="brand-icon" src="assets/icone-dota-2.png" alt="" />
      <span>The <b>National</b></span>
    </a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
